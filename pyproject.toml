[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CyberGhost-Linux-UI"
version = "0.1.4"
description = "An independent Linux desktop interface for the CyberGhost VPN CLI."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/r-vage/CyberGhost-Linux-UI"
Issues = "https://github.com/r-vage/CyberGhost-Linux-UI/issues"

[project.scripts]
cyberghost-desktop = "cyberghost_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["cyberghost_desktop*"]

[tool.setuptools.package-data]
cyberghost_desktop = ["style.css", "icons/*.svg", "assets/flags/*.svg", "assets/flags/LICENSE", "assets/flags/SOURCE.txt", "locales/*.json", "locale_manifest.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
